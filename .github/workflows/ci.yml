name: repairtracker-ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e .
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Discovery smoke
        run: repairtracker discover . > repairtracker-system-model.json
      - name: Portfolio bootstrap smoke
        run: repairtracker portfolio-local . --portfolio-id self > repairtracker-portfolio.json
      - name: Hostile-review smoke
        run: repairtracker hostile-template "the repair is complete" --success "exact-subject verification passes"

  github-read-smoke:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install
        run: python -m pip install -e .
      - name: Live read-only GitHub portfolio bootstrap
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: repairtracker portfolio-github ${{ github.repository }} --portfolio-id self-github > repairtracker-github-portfolio.json
